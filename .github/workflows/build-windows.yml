name: Build Windows app

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Build portable Windows executable
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle

      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item -LiteralPath target/release/win-ethernet-switcher.exe -Destination artifacts/EthernetSwitcher.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Ethernet-Switcher-Windows
          path: artifacts/EthernetSwitcher.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/EthernetSwitcher.exe
